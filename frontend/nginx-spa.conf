server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: все маршруты → index.html (React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Статика с хэш-именами (Vite): кеш 1 год
    location ~* \.(js|css|woff2?|svg|png|jpg|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # index.html без кеша — браузер всегда получает актуальную версию
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
